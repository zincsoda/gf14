<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GF 0014-2009 Component Lookup</title>
    <meta name="description" content="Lookup GF 0014-2009 Chinese character components by ID, glyph, pinyin, meaning, source name, or component type.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231f4f46'/%3E%3Cpath d='M15 18h34v7H36v25h-8V25H15z' fill='%23f5dfb5'/%3E%3Cpath d='M18 46h28v5H18z' fill='%23e26d5c'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css?v=2">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="Component lookup">
        <header class="topbar">
          <div>
            <p class="eyebrow">GF 0014-2009</p>
            <h1>Component Lookup</h1>
          </div>
        </header>

        <section class="decomposer" aria-labelledby="decomposerTitle">
          <div class="decomposer-heading">
            <div>
              <p class="eyebrow">3,500 common characters</p>
              <h2 id="decomposerTitle">Character decomposition</h2>
            </div>
            <form id="decomposerForm" class="character-form">
              <label for="characterInput">Character</label>
              <div class="character-entry">
                <input id="characterInput" type="text" inputmode="text" autocomplete="off" maxlength="1" value="想" aria-describedby="decompositionNote">
                <button type="submit">Decompose</button>
              </div>
            </form>
          </div>

          <div id="decompositionResult" class="decomposition-result" aria-live="polite">
            <div id="decompositionGlyph" class="decomposition-glyph" lang="zh-Hans">想</div>
            <div class="decomposition-content">
              <div class="decomposition-meta">
                <span id="decompositionStatus" class="status-badge">GF0014</span>
                <span id="decompositionStructure"></span>
              </div>
              <div>
                <p class="result-label">GF0014 components</p>
                <div id="decompositionComponents" class="component-chips"></div>
              </div>
              <p id="decompositionNote" class="decomposition-note"></p>
            </div>
          </div>
        </section>

        <div class="search-row">
          <label class="search-field">
            <span>Search</span>
            <input id="searchInput" type="search" autocomplete="off" placeholder="ID, character, pinyin, meaning, source">
          </label>
          <div class="filters" role="group" aria-label="Catalog filter">
            <button class="filter-button active" type="button" data-filter="all">All</button>
            <button class="filter-button" type="button" data-filter="unmapped">Unmapped</button>
          </div>
        </div>

        <div class="stats" aria-live="polite">
          <span id="resultCount">514 components</span>
          <span>GF0014 details</span>
        </div>

        <div class="content-grid">
          <section class="catalog-panel" aria-label="Components">
            <div id="componentList" class="component-list"></div>
          </section>

          <section class="detail-panel" aria-label="Selected component">
            <div class="detail-card">
              <div class="detail-main">
                <div id="glyph" class="glyph" lang="zh-Hans">一</div>
                <div>
                  <div class="id-row">
                    <span id="gfId">GF 138</span>
                    <span id="unicodeValue">U+4E00</span>
                  </div>
                  <h2 id="componentTitle">一</h2>
                  <p id="pinyinValue" class="pinyin">heng2 / yi1</p>
                </div>
              </div>

              <dl class="facts">
                <div>
                  <dt>Meaning</dt>
                  <dd id="meaningValue"></dd>
                </div>
                <div>
                  <dt>Description</dt>
                  <dd id="descriptionValue"></dd>
                </div>
                <div>
                  <dt>Source name</dt>
                  <dd id="sourceNameValue"></dd>
                </div>
                <div>
                  <dt>Component type</dt>
                  <dd id="componentTypeValue"></dd>
                </div>
              </dl>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script src="components-data.js?v=2"></script>
    <script src="decompositions-data.js?v=2"></script>
    <script src="app.js?v=3"></script>
  </body>
</html>
